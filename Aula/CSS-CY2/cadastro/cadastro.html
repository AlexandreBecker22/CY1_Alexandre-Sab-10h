    <section class="cad01">
        <br>
        <br>
        <br>
            <section class="input01">
                <div >
                <label class="label" for="IP01"><i>Insira o nome da música</i></label>
                <input class="inputss1" id="IP01" placeholder="Digite o nome da música buscada">
                </div>
                <div >
                <label class="label" for="IP02"><i>Insira o nome do(s) autor(es)</i></label>
                <input class="inputss1" type="text" placeholder="Digite o nome da banda/cantor" class="IP02">
                </div>
                <div >
                <label class="label" for="IP03"><i>Insira o estilo musical</i></label>
                <input class="inputss1" type="text" placeholder="Digite o estilo de música(exemplo:rock pop)" class="IP03">
                </div>
                <div >
                <label class="label" for="link"><i>Insira um link de acesso</i></label>

                </div>
                <div >
                <label class="label" for="IMG01"><i>Insira uma imagem</i></label>
                <input class="inputss1" type="file" name="" id="IMG01">
                </div>
                <div >
                <label class="label" for="audio001"><i>Insira um audio da música</i></label>
                <input class="inputss1" type="file" placeholder="insira um audio" class="audio001">
                </div>
            </section>
            <div >
                <button class="B01" class="input01" class="inputss1" onclick="Cadastrar_Jogo()"><i>Cadastrar música</i></button>
            </div>
    </section>
    <section class="lista_de_música"></section>
