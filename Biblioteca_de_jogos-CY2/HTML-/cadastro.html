<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./../CSS/index.css">
</head>

<body>
    <header class="header01">
        <div class="p">
            <b class="title01">Biblioteca Gamer 002</b>
            <ul class="pag">
                <li class="signIn"><a href="./../HTML-/cadastro.html">Sign In</a></li>
                <li class="signIn"><a href="./../HTML-/home.html">Home</a></li>
            </ul>
        </div>
    </header>
    <main>
        <div class="divinputs">
            <section class="inputnsds">
                <form>

                    <label for="usuario01"><b>Nome de usuario:</b></label>
                    <input type="text" placeholder="Preencha com seu usuario" class="senhaeusuario01" class="usuario01"
                        required>
                    <br>
                    <label for="senha01"><b>Senha:</b></label>
                    <input type="password" placeholder="Preencha com sua senha" class="senhaeusuario01" class="senha01"
                        required>
                    <ol>
                        <li>A senha deve ter pelo menos uma letra maiuscula;</li>
                        <li>A senha deve ter no minimo uma letra minuscula;</li>
                        <li>A senha tambem deve conter um ou mais numeros;</li>
                        <li>Ela nao deve conter nem um caractere especial.</li>
                    </ol>
                    <br>
                    <label for="email01"><b>E-mail:</b></label>
                    <input type="email" placeholder="Preencha com seu e-mail" class="senhaeusuario01" class="email01"
                        required>
                    <br>
                    <label for="data01"><b>Data de nascimento:</b></label><b>(opcional)</b>
                    <input type="date" placeholder="Insira sua data de nascimento" class="data01"
                        class="senhaeusuario01">
                    <br>
                    <div id="mensagem"></div>
                    <input type="submit" onclick="CadastrarUsuario()"
                    id="botaoCadastrar">
                </form>
                <input onclick="CadastrarUsuario()" type="submit" value=" Cadastrar" class="submit01">

            </section>
        </div>
    </main>
    <footer></footer>
    <script src="./../../Biblioteca_de_jogos-CY2/Java/cadastro.js"></script>
</body>

</html>
